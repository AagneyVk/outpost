Section "Device"
 Identifier "v86"
 Driver "vesa"
EndSection
Section "Screen"
 Identifier "Screen"
 Device "v86"
 DefaultDepth 24
 SubSection "Display"
  Depth 24
  Modes "1024x768"
 EndSubSection
EndSection
Section "ServerFlags"
 Option "AutoAddDevices" "false"
EndSection
Section "InputDevice"
 Identifier "Keyboard"
 Driver "evdev"
 Option "Device" "/dev/input/event0"
EndSection
Section "InputDevice"
 Identifier "Mouse"
 Driver "evdev"
 Option "Device" "/dev/input/event1"
 Option "Protocol" "auto"
EndSection
Section "ServerLayout"
 Identifier "Layout"
 Screen "Screen"
 InputDevice "Keyboard" "CoreKeyboard"
 InputDevice "Mouse" "CorePointer"
EndSection
