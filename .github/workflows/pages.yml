name: Deploy OUTPOST to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/configure-pages@v5
        id: pages
      - name: Fetch verified Linux demo runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download linux-demo-v1 --repo "$GITHUB_REPOSITORY" --pattern outpost-pages-linux-v1.tar.gz --output linux.tar.gz
          echo 'c0708520fcedac3d2259f4b59f8ce78101bf2e002d68a12e6e4986e0d90c63d2  linux.tar.gz' | sha256sum --check
          mkdir linux-runtime
          tar -xzf linux.tar.gz -C linux-runtime
      - run: node tools/build-pages.mjs "$PAGES_BASE" pages-dist linux-runtime
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist
      - uses: actions/deploy-pages@v4
        id: deploy
        with:
          timeout: 1800000
